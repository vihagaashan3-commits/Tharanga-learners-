<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Question Papers | Tharanga Learners</title>
        <link rel="icon" type="image/png" href="images/logo.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body data-page="exam">
        <div id="site-header"></div>
        <div class="page-banner"><div class="container"><small>HOME /</small><h1 class="h3 fw-bold mb-0">Rehearsal Question Papers</h1></div></div>

        <main class="container py-5">
            <div id="list"><div class="row g-4" id="cols"></div></div>

            <div id="intro" class="exam-card text-center" hidden>
                <button class="btn btn-link fw-semibold p-0 mb-3 d-block" id="back1"></button>
                <img id="i-img" class="details-img" alt="">
                <h3 class="h4 mt-3" id="i-paper"></h3>
                <button class="btn-brand mt-2" id="start"></button>
            </div>

            <div id="quiz" class="exam-card" hidden>
                <div class="exam-bar"><i id="bar"></i></div>
                <div class="d-flex justify-content-between mt-2"><span id="timer" class="fw-semibold"></span><span id="count" class="fw-semibold"></span></div>
                <div id="qbox" class="my-3 text-center"></div>
                <div id="opts"></div>
                <div class="text-center mt-3"><button class="btn-brand" id="next"></button></div>
            </div>

            <div id="result" class="exam-card" hidden></div>
        </main>

        <div id="site-footer"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/data.js"></script>
        <script src="js/main.js"></script>
        <script src="js/papers/papers.js"></script>
        <script src="js/question-papers.js"></script>
    </body>
</html>
