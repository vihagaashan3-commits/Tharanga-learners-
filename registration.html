<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Registration | Tharanga Learners Driving School</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body data-page="registration">
        <div id="site-header"></div>
        <main class="container"><div class="form-card"><h2>New Student Registration Form</h2>
                <form id="reg">
                    <label>සම්පූර්ණ නම / Full Name *</label><input class="form-control" name="name" required>
                    <label>විද්‍යුත් තැපැල් ලිපිනය / Email Address <small class="muted">(Optional)</small></label><input class="form-control" type="email" name="email">
                    <label>ජාතික හැඳුනුම්පත් අංකය / NIC *</label><input class="form-control" name="nic" maxlength="12" required><small class="muted" id="nicc">0 of 12 max characters.</small>
                    <label>දුරකථන අංකය / Mobile Number *</label><input class="form-control" name="tel" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" title="10 digits" required><small class="muted" id="telc">0 of 10 max characters.</small>
                    <label>ලිපිනය / Address <small class="muted">(Optional)</small></label><input class="form-control" name="addr">
                    <label>බලපත්‍ර වර්ගය / Select License Type *</label>
                    <select class="form-select" name="type"><option>Motor Bike Only</option><option>Light Vehicle (Car/Van)</option><option>Three Wheeler</option><option>Heavy Vehicle</option><option>Prime Mover</option></select>
                    <label>ඔබට ළඟම ශාඛාව / Choose your nearest branch *</label><div id="branches"></div>
                    <button class="btn-brand mt-4" type="submit">Submit</button></form>
                <div id="thanks" class="text-center py-4" hidden><div style="font-size:3rem">✅</div><p class="fw-bold">Thank you, <span id="who"></span>!</p>
                    <a id="wa" class="btn-brand" target="_blank" rel="noopener">Send details on WhatsApp</a></div></div></main>
        <div id="site-footer"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="js/data.js"></script>
        <script src="js/main.js"></script>
        <script src="js/registration.js"></script>
    </body>
</html>
