<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Road Signs | Tharanga Learners</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body data-page="road">
    <div id="site-header"></div>
    <div class="page-banner"><div class="container"><small>HOME /</small><h1 class="h3 fw-bold mb-0">Road Signs</h1></div></div>

    <main class="container py-5">
      <div class="card-x mx-auto" id="pick" style="max-width:680px">
        <ul class="small list-unstyled">
          <li>▣ Select the language to continue.</li>
          <li>▣ ඉදිරියට යාම සඳහා භාෂාව තෝරාගන්න.</li>
          <li>▣ தொடர மொழியைத் தேர்ந்தெடுக்கவும்.</li>
        </ul>
        <div class="row g-2">
          <div class="col-4"><button class="btn-brand w-100" data-lang="en">English</button></div>
          <div class="col-4"><button class="btn-brand w-100" data-lang="si">සිංහල</button></div>
          <div class="col-4"><button class="btn-brand w-100" data-lang="ta">தமிழ்</button></div>
        </div>
      </div>

      <div id="view" hidden>
        <button class="btn btn-link fw-semibold p-0 mb-3" id="back">← Change language</button>
        <div id="signs"></div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/signs.js"></script>
    <script src="js/road-signs.js"></script>
  </body>
</html>
